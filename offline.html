<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1EF">
<title>BassCast SA · Offline</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<style>
:root{--mist:#EDF1EF;--paper:#F7F9F8;--ink:#12262E;--depth:#1D4E5C;--gold:#E3A72F;--line:#C9D4D1;--muted:#4F646B}
@media (prefers-color-scheme:dark){:root{--mist:#0E1F26;--paper:#17313A;--ink:#E3ECEE;--depth:#4FA3B5;--line:#2C4A53;--muted:#9DB3B9}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--mist);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:420px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center}
svg{width:64px;height:40px}
h1{font-size:1.35rem;margin:12px 0 6px;letter-spacing:-.01em}
p{margin:0 0 12px;color:var(--muted)}
button{margin-top:6px;background:linear-gradient(135deg,#12262E,#1D4E5C);color:#EDF1EF;border:0;border-radius:10px;padding:12px 20px;font:700 1rem system-ui,sans-serif;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 40" fill="none" aria-hidden="true">
    <path d="M2 22c6-10 16-16 28-16 8 0 14 3 20 8 3 2 6 3 9 2-2 3-5 5-9 6-1 4-4 7-8 9-5 2-11 1-15-2-3 3-7 4-11 3 2-3 3-7 2-10-5 1-10 1-16 0z" fill="currentColor"/>
    <circle cx="48" cy="16" r="2.4" fill="#E3A72F"/>
  </svg>
  <h1>You&rsquo;re offline</h1>
  <p>BassCast SA couldn&rsquo;t load because there&rsquo;s no internet connection, and the app hasn&rsquo;t been saved to this device yet.</p>
  <p>Open it once while you have signal and it will be ready to use offline after that, with your last forecast, saved spots and catch log.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
